<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>てがき れんしゅう（検証用）</title>
<style>
  :root { --bg:#fff8e7; --ink:#1f2937; --ok:#16a34a; --ng:#dc2626; --hint:#f59e0b; --guide:#e5e7eb; --accent:#2563eb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: "Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 16px; overscroll-behavior:none; }
  .tabs, .tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:20px; padding:8px 14px; border-radius:14px; border:2px solid #cbd5e1; background:#fff; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #chars { display:flex; gap:6px; overflow-x:auto; max-width:100%; padding:4px; }
  #chars button { font-size:26px; min-width:52px; }
  #chars button.cleared { background:#dcfce7; }
  #chars button.on { background:var(--accent); color:#fff; }
  #stage { position:relative; width:min(88vw, 62vh, 560px); aspect-ratio:1; background:#fff; border:4px solid #b45309; border-radius:12px; touch-action:none; }
  #stage svg, #stage canvas { position:absolute; inset:0; width:100%; height:100%; }
  #msg { font-size:28px; min-height:1.4em; font-weight:bold; }
  #debug { font-size:12px; color:#6b7280; font-family:monospace; }
  .stroke-anim { animation: draw 0.7s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .flash { animation: flash 0.9s ease 2; }
  @keyframes flash { 50% { opacity:0.15; } }
</style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div id="chars"></div>
  <div id="msg">もじを えらんでね</div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 109 109"></svg>
    <canvas id="ink"></canvas>
  </div>
  <div class="tools">
    <button id="demo">👀 おてほん</button>
    <button id="retry">🔄 もういちど</button>
    <button id="say">🔊 よむ</button>
    <button id="guide">うすい じ: ON</button>
    <select id="tol" style="font-size:18px;padding:6px;border-radius:10px">
      <option value="20">やさしい</option>
      <option value="16" selected>ふつう</option>
      <option value="12">きびしい</option>
    </select>
  </div>
  <div id="debug"></div>

<script type="module">
import { SETS, STROKES } from './strokes-data.js';
import { StrokeJudge, pathToPoints } from './judge.js';

const $ = id => document.getElementById(id);
const svg = $('svg'), canvas = $('ink'), ctx = canvas.getContext('2d');
const NS = 'http://www.w3.org/2000/svg';
const TAB_NAMES = { hira: 'ひらがな', kata: 'カタカナ', g1: '1ねんの かんじ', g2: '2ねんの かんじ' };
const REASON = {
  direction: 'むきが ぎゃく かも？',
  order: 'かきじゅんを たしかめよう',
  shape: 'おしい！ もういちど',
};
let set = 'hira', ch = null, judge = null, showGuide = true, fails = 0, penSeen = false;
const cleared = new Set(JSON.parse(safeGet('cleared') || '[]'));

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

// ---- UI ----
for (const k of Object.keys(SETS)) {
  const b = document.createElement('button');
  b.textContent = TAB_NAMES[k]; b.onclick = () => { set = k; renderTabs(); renderChars(); pick([...SETS[k]][0]); };
  b.dataset.k = k; $('tabs').append(b);
}
function renderTabs() { for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.k === set); }
function renderChars() {
  $('chars').replaceChildren(...[...SETS[set]].map(c => {
    const b = document.createElement('button');
    b.textContent = c; b.classList.toggle('on', c === ch); b.classList.toggle('cleared', cleared.has(c));
    b.onclick = () => pick(c); return b;
  }));
}

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr * r.width / 109, 0, 0, dpr * r.height / 109, 0, 0); // 109座標系で描く
  ctx.lineCap = ctx.lineJoin = 'round';
}
addEventListener('resize', () => { resize(); redrawInk(); });

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.append(e); return e;
}
function drawGrid() {
  svg.replaceChildren();
  el('line', { x1: 54.5, y1: 0, x2: 54.5, y2: 109, stroke: '#fca5a5', 'stroke-dasharray': '2 2', 'stroke-width': 0.5 });
  el('line', { x1: 0, y1: 54.5, x2: 109, y2: 54.5, stroke: '#fca5a5', 'stroke-dasharray': '2 2', 'stroke-width': 0.5 });
}
function drawTemplate() {
  drawGrid();
  if (!ch) return;
  STROKES[ch].forEach((d, i) => {
    const done = judge && i < judge.index;
    if (!showGuide && !done) return;
    el('path', { d, fill: 'none', stroke: done ? '#111827' : 'var(--guide)', 'stroke-width': done ? 5 : 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', id: 's' + i });
  });
}
function hintStroke(i) {
  const d = STROKES[ch][i];
  const p = el('path', { d, fill: 'none', stroke: 'var(--hint)', 'stroke-width': 6, 'stroke-linecap': 'round', class: 'flash' });
  // 始点に丸をつけて「ここから」を示す
  const [x, y] = pathToPoints(d)[0];
  const c = el('circle', { cx: x, cy: y, r: 4, fill: 'var(--hint)', class: 'flash' });
  setTimeout(() => { p.remove(); c.remove(); }, 1900);
}

function pick(c) {
  ch = c; fails = 0; judge = new StrokeJudge(STROKES[c], +$('tol').value);
  $('msg').textContent = `「${c}」を かいてみよう（${STROKES[c].length}かく）`;
  renderChars(); resize(); clearInk(); drawTemplate();
}
$('retry').onclick = () => ch && pick(ch);
$('tol').onchange = () => ch && pick(ch);
$('guide').onclick = () => { showGuide = !showGuide; $('guide').textContent = `うすい じ: ${showGuide ? 'ON' : 'OFF'}`; drawTemplate(); };
$('say').onclick = () => ch && speak(ch);
$('demo').onclick = async () => {
  if (!ch) return;
  drawGrid();
  for (const d of STROKES[ch]) {
    const p = el('path', { d, fill: 'none', stroke: '#111827', 'stroke-width': 5, 'stroke-linecap': 'round' });
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.classList.add('stroke-anim');
    await new Promise(r => setTimeout(r, 800));
  }
  setTimeout(drawTemplate, 800);
};

// ---- 音声 ----
let jaVoice = null;
function loadVoices() { jaVoice = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('ja')) || null; }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// ---- 手書き入力 ----
let cur = null, ink = [];
function clearInk() { ink = []; ctx.clearRect(0, 0, 109, 109); }
function redrawInk() { ctx.clearRect(0, 0, 109, 109); for (const s of ink) drawStroke(s.pts, s.color); }
function drawStroke(pts, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 4.5; ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
}
function toBox(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * 109 / r.width, (e.clientY - r.top) * 109 / r.height]; }

canvas.addEventListener('pointerdown', e => {
  if (!judge || judge.finished) return;
  if (e.pointerType === 'pen') penSeen = true;
  if (penSeen && e.pointerType === 'touch') return; // ペンを使っているときは手のひらを無視
  canvas.setPointerCapture(e.pointerId); cur = { id: e.pointerId, pts: [toBox(e)] };
});
canvas.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== cur.id) return;
  for (const ev of e.getCoalescedEvents?.() ?? [e]) cur.pts.push(toBox(ev));
  redrawInk(); drawStroke(cur.pts, '#374151');
});
const end = e => {
  if (!cur || e.pointerId !== cur.id) return;
  const pts = cur.pts; cur = null;
  if (pts.length < 2) pts.push([pts[0][0] + 0.5, pts[0][1] + 0.5]); // 点を打っただけ
  const t0 = performance.now(); const i = judge.index; const r = judge.judge(pts); const ms = (performance.now() - t0).toFixed(2);
  $('debug').textContent = `画${i + 1}: ${r.reason} dist=${r.dist.toFixed(1)} tol=${judge.tolerance} 判定${ms}ms input=${e.pointerType} pts=${pts.length}`;
  if (r.ok) {
    fails = 0; ink = []; redrawInk(); drawTemplate();
    if (judge.finished) {
      $('msg').textContent = '🎉 できた！'; speak('よくできました');
      cleared.add(ch); safeSet('cleared', JSON.stringify([...cleared])); renderChars();
    } else $('msg').textContent = `いいね！ つぎは ${judge.index + 1}かくめ`;
  } else {
    fails++;
    ink = [{ pts, color: '#dc2626' }]; redrawInk();
    setTimeout(() => { ink = []; redrawInk(); }, 700);
    $('msg').textContent = REASON[r.reason];
    if (fails >= 2 || r.reason !== 'shape') hintStroke(i);
  }
};
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

renderTabs(); renderChars(); resize(); drawGrid();
</script>
</body>
</html>
